<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saturnix AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #0b0b0e;
            color: #e2e2e6;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            flex-direction: column;
        }

        .top-bar {
            background-color: #121217;
            padding: 15px;
            border-bottom: 1px solid #1f1f29;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00ffcc, #7928ca);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #00ffcc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-box {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .api-input {
            flex: 1;
            padding: 10px 15px;
            background-color: #1c1c24;
            border: 1px solid #2d2d3d;
            border-radius: 8px;
            color: #e2e2e6;
            outline: none;
            font-size: 0.9rem;
        }
        
        .api-input:focus {
            border-color: #00ffcc;
        }

        .btn-salvar-token {
            padding: 10px 15px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #0b0b0e;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .saturnix-message {
            background-color: #1c1c24;
            color: #e2e2e6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #00ffcc;
        }

        .system-message {
            background-color: #271c3a;
            color: #d8b4fe;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #a855f7;
        }

        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, #0b0b0e 70%, transparent);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        input.chat-input {
            width: 100%;
            padding: 14px 20px;
            background-color: #121217;
            border: 1px solid #2d2d3d;
            border-radius: 24px;
            color: #e2e2e6;
            font-size: 0.95rem;
            outline: none;
        }

        input.chat-input:focus {
            border-color: #00ffcc;
        }

        .btn-enviar {
            background: linear-gradient(135deg, #00ffcc, #2563eb);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container">
            <div class="logo-icon">S</div>
            <div class="brand-name">SATURNIX AI</div>
        </div>
        <div class="api-box">
            <input type="password" id="tokenInput" class="api-input" placeholder="Cole sua chave ativa hf_..." autocomplete="off">
            <button id="btnSalvarToken" class="btn-salvar-token">Salvar</button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
            <div class="message system-message" id="boasVindasMsg">
                Olá! Para ativar o Saturnix, cole um Token ativo do Hugging Face no campo acima e clique em "Salvar".
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Envie uma mensagem..." autocomplete="off">
            </div>
            <button id="btnEnviar" class="btn-enviar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const MODEL_URL = "https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct";

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const btnEnviar = document.getElementById('btnEnviar');
        const tokenInput = document.getElementById('tokenInput');
        const btnSalvarToken = document.getElementById('btnSalvarToken');
        const boasVindasMsg = document.getElementById('boasVindasMsg');

        let tokenSalvo = localStorage.getItem('saturnix_api_key') || "";

        if (tokenSalvo) {
            tokenInput.value = tokenSalvo;
            boasVindasMsg.innerText = "Saturnix pronto e conectado! Como posso ajudar você?";
        }

        btnSalvarToken.addEventListener('click', () => {
            const novoToken = tokenInput.value.trim();
            if (novoToken && novoToken.startsWith("hf_")) {
                localStorage.setItem('saturnix_api_key', novoToken);
                tokenSalvo = novoToken;
                alert("Chave salva com sucesso!");
                boasVindasMsg.innerText = "Saturnix pronto e conectado! Como posso ajudar você?";
            } else {
                alert("Por favor, cole uma chave válida que comece com hf_");
            }
        });

        async function chamarHuggingFace(textoUsuario) {
            if (!tokenSalvo) {
                return "Por favor, cole sua chave ativa hf_ no topo da página e clique em Salvar.";
            }

            try {
                const response = await fetch(MODEL_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${tokenSalvo}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: textoUsuario,
                        parameters: { max_new_tokens: 150, return_full_text: false }
                    })
                });

                const data = await response.json();
                
                if (data && data.error && data.error.includes("loading")) {
                    return "O modelo está iniciando nos servidores. Tente enviar novamente em instantes!";
                }

                if (data && data[0] && data[0].generated_text) {
                    return data[0].generated_text.trim();
                } else if (data.generated_text) {
                    return data.generated_text.trim();
                }
                
                return "A IA não retornou texto. Verifique se seu token está ativo.";
            } catch (erro) {
                return "Erro ao conectar com a API. Verifique seu token.";
            }
        }

        async function enviarMensagem() {
            const texto = userInput.value.trim();
            if (!texto) return;

            const msgUser = document.createElement('div');
            msgUser.className = 'message user-message';
            msgUser.innerText = texto;
            chatMessages.appendChild(msgUser);

            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const msgCarregando = document.createElement('div');
            msgCarregando.className = 'message saturnix-message';
            msgCarregando.innerText = "Pensando...";
            chatMessages.appendChild(msgCarregando);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const respostaIA = await chamarHuggingFace(texto);

            chatMessages.removeChild(msgCarregando);

            const msgSaturnix = document.createElement('div');
            msgSaturnix.className = 'message saturnix-message';
            msgSaturnix.innerText = respostaIA;
            chatMessages.appendChild(msgSaturnix);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        btnEnviar.addEventListener('click', enviarMensagem);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensagem();
        });
    </script>
</body>
</html>
