<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saturnix AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #0b0b0e;
            color: #e2e2e6;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            flex-direction: column;
        }

        .top-bar {
            background-color: #121217;
            padding: 15px;
            border-bottom: 1px solid #1f1f29;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00ffcc, #7928ca);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #00ffcc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #0b0b0e;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .saturnix-message {
            background-color: #1c1c24;
            color: #e2e2e6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #00ffcc;
        }

        .system-message {
            background-color: #271c3a;
            color: #d8b4fe;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid #a855f7;
        }

        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, #0b0b0e 70%, transparent);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        input.chat-input {
            width: 100%;
            padding: 14px 20px;
            background-color: #121217;
            border: 1px solid #2d2d3d;
            border-radius: 24px;
            color: #e2e2e6;
            font-size: 0.95rem;
            outline: none;
        }

        input.chat-input:focus {
            border-color: #00ffcc;
        }

        .btn-enviar {
            background: linear-gradient(135deg, #00ffcc, #2563eb);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-container">
            <div class="logo-icon">S</div>
            <div class="brand-name">SATURNIX AI</div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
            <div class="message system-message" id="boasVindasMsg">
                Saturnix Core v2.1 Online! Sistema local ativado com sucesso para respostas instantâneas. Como posso ajudar?
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Envie uma mensagem..." autocomplete="off">
            </div>
            <button id="btnEnviar" class="btn-enviar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const btnEnviar = document.getElementById('btnEnviar');

        function gerarRespostaLocal(texto) {
            const t = texto.toLowerCase();
            
            if (t.includes("oi") || t.includes("olá") || t.includes("salve")) {
                return "Salve, mano! Eu sou o Saturnix AI. Como está indo a criação do site? O código agora está rodando direto e sem quedas!";
            }
            if (t.includes("tudo bem") || t.includes("como voce esta")) {
                return "Tudo excelente por aqui, agora que estou rodando de forma estável no seu servidor do GitHub! E com você?";
            }
            if (t.includes("quem é você") || t.includes("seu nome")) {
                return "Eu sou o Saturnix AI, seu assistente pessoal e projeto oficial de inteligência web!";
            }
            if (t.includes("ajuda") || t.includes("ajudar")) {
                return "Estou aqui para ajudar! Você pode me fazer perguntas sobre desenvolvimento de sites, design ou bater um papo.";
            }
            if (t.includes("criador") || t.includes("quem te criou")) {
                return "Fui desenvolvido e customizado pelo MikeCreator! O site está ficando insano.";
            }
            
            const respostasPadrao = [
                "Entendido! Meu sistema local processou sua mensagem com sucesso. O que quer fazer a seguir no projeto?",
                "Interessante! Agora que o chat não depende de tokens externos, posso responder instantaneamente qualquer comando.",
                "Processado com sucesso pelo núcleo Saturnix Core! Bora continuar testando as funções.",
                "Com certeza, mano! O código está respondendo rápido e sem travar agora."
            ];
            
            const index = Math.floor(Math.random() * respostasPadrao.length);
            return respostasPadrao[index];
        }

        async function enviarMensagem() {
            const texto = userInput.value.trim();
            if (!texto) return;

            // Mensagem do Usuário
            const msgUser = document.createElement('div');
            msgUser.className = 'message user-message';
            msgUser.innerText = texto;
            chatMessages.appendChild(msgUser);

            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Criar balão de Carregamento
            const msgCarregando = document.createElement('div');
            msgCarregando.className = 'message saturnix-message';
            msgCarregando.innerText = "Pensando...";
            chatMessages.appendChild(msgCarregando);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Pequena pausa para parecer uma IA real pensando
            await new Promise(resolve => setTimeout(resolve, 600));

            // REMOVE o balão de carregamento de forma correta antes de exibir a resposta
            if (msgCarregando && msgCarregando.parentNode) {
                msgCarregando.parentNode.removeChild(msgCarregando);
            }

            // Mensagem de resposta real do Saturnix
            const respostaIA = gerarRespostaLocal(texto);
            const msgSaturnix = document.createElement('div');
            msgSaturnix.className = 'message saturnix-message';
            msgSaturnix.innerText = respostaIA;
            chatMessages.appendChild(msgSaturnix);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        btnEnviar.addEventListener('click', enviarMensagem);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensagem();
        });
    </script>
</body>
</html>
